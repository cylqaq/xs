name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run smoke suite
        run: npm run smoke:all
