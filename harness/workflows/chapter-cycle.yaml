# 单章多智能体微循环 — 各 Skill 隔离对话，只经 handoff + 协议文件协作
workflow: chapter-cycle
description: navigator → context-router → chapter-production → [dialogue] → continuity → persona-evolution → retention → rule-reviewer → phase advance

steps:
  - id: navigate
    skill: navigator
    manifest: chapter-draft
    isolation: true
    cli_preflight:
      - doctor --chapter {chapter}
      - nav build --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-navigator.yaml
    note: 第十轮新增 · 读 INDEX 输出 context-plan，防雪球

  - id: route-context
    skill: context-router
    manifest: chapter-draft
    isolation: true
    reads_handoff:
      - navigator
    cli_preflight:
      - manifest chapter-draft --chapter {chapter}
      - context --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-context-router.yaml

  - id: draft
    skill: chapter-production
    manifest: chapter-draft
    isolation: true
    cli_preflight:
      - manifest chapter-draft --chapter {chapter}
    cli_postflight:
      - draft check --chapter {chapter}
    reads_handoff:
      - context-router
    requires_files:
      - manuscripts/chapters/ch-{chapter_padded}.md
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-chapter-production.yaml

  - id: dialogue
    skill: dialogue-craftsman
    manifest: chapter-draft
    isolation: true
    when_dialogue: true
    reads_handoff:
      - chapter-production
    requires_files:
      - manuscripts/chapters/ch-{chapter_padded}.md
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-dialogue-craftsman.yaml

  - id: continuity
    skill: continuity-warden
    manifest: post-chapter
    isolation: true
    reads_handoff:
      - chapter-production
    reads_handoff_when_dialogue:
      - dialogue-craftsman
    gate: draft_ready
    requires_files:
      - state/memory/chapter-summaries/ch-{chapter_padded}.yaml
      - registries/continuity-log.yaml
      - state/memory/summary-rolling.md
      - registries/appearance-log.yaml
      - registries/character-state-log.yaml
      - registries/world-state-log.yaml
      - registries/narrative-sparks.yaml
    cli_preflight:
      - manifest post-chapter --chapter {chapter}
    cli_postflight:
      - compact --chapter {chapter}
      - validate --task post-chapter --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-continuity-warden.yaml

  - id: persona-evolution
    skill: persona-evolution-warden
    manifest: post-chapter
    isolation: true
    skip_when: no_persona_shift_triggers
    reads_handoff:
      - continuity-warden
    requires_files:
      - registries/persona-shifts.yaml
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-persona-evolution-warden.yaml

  - id: retention
    skill: retention-analyst
    manifest: post-chapter
    isolation: true
    reads_handoff:
      - persona-evolution-warden
    requires_files:
      - state/retention/ch-{chapter_padded}.yaml
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-retention-analyst.yaml

  - id: review
    skill: rule-reviewer
    isolation: true
    reads_handoff:
      - retention-analyst
    cli_postflight:
      - review --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-rule-reviewer.yaml
    on_fail_goto: patch-cycle

  - id: advance
    skill: novel-orchestrator
    isolation: true
    reads_handoff:
      - rule-reviewer
    requires_review_pass: true
    handoff_writes:
      - state/working/handoffs/ch-{chapter_padded}-novel-orchestrator.yaml
    note: review PASS 后执行 forge phase advance --chapter {chapter}（自动写本步 handoff）

# 字数哲学与根项目保护（新增）
word_count_philosophy:
  reference: skills/guides/word-count-philosophy.md
  principle: 故事合理性优先于字数达标

root_project_protection:
  reference: docs/ops/root-project-protection.md
  principle: 根项目是万能的母版，书籍项目应放在 e:/个人/写书/ 下
