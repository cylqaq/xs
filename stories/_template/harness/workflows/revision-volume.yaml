workflow: revision-volume
description: 卷级 chief-editor → style-guardian → patch-refiner → rule-reviewer 多智能体精修

steps:
  - id: chief-edit
    skill: chief-editor
    manifest: revision-volume
    isolation: true
    cli_preflight:
      - manifest revision-volume --chapter {chapter}
    requires_files:
      - state/checkpoints/revision-vol-01.yaml
    handoff_writes:
      - state/working/handoffs/revision-chief-editor.yaml

  - id: style
    skill: style-guardian
    isolation: true
    reads_handoff:
      - chief-editor
    handoff_writes:
      - state/working/handoffs/revision-style-guardian.yaml

  - id: patch
    skill: patch-refiner
    isolation: true
    reads_handoff:
      - style-guardian
    cli_postflight:
      - validate --task revision-volume --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/revision-patch-refiner.yaml

  - id: re-review
    skill: rule-reviewer
    isolation: true
    reads_handoff:
      - patch-refiner
    cli_postflight:
      - review --chapter {chapter}
    handoff_writes:
      - state/working/handoffs/revision-rule-reviewer.yaml

# 字数哲学与根项目保护（新增）
word_count_philosophy:
  reference: skills/guides/word-count-philosophy.md
  principle: 故事合理性优先于字数达标

root_project_protection:
  reference: docs/ops/root-project-protection.md
  principle: 根项目是万能的母版，书籍项目应放在 e:/个人/写书/ 下
